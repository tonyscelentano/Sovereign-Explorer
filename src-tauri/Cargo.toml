[package]
name = "sovereign-explorer"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=1.5.6", features = [] }

[dependencies]
tauri = { version = "=1.8.3", features = [ "shell-execute", "fs-all", "window-all", "protocol-asset"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
dirs = "=5.0.1"
once_cell = "=1.21.4"
font-kit = "=0.14.3"
portable-pty = "=0.9.0"
trash = "=3.3.1"

[features]
# default enables all tauri features
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
